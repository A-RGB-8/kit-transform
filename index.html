<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiT-Transform</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .content {
      text-align: center;
      width: min(90vw, 900px);
    }

    .logo {
      width: min(80vw, 700px);
      height: auto;
      display: block;
      margin: 0 auto 30px;
    }

    .coming-soon {
      margin: 0;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #1f2937;
    }
  </style>
</head>

<body>
  <main class="content">
    <img src="logo.png" alt="KiT-Transform Logo" class="logo">
    <p class="coming-soon">Coming soon</p>
  </main>
</body>
</html>
